
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        header {
            text-align: center;
            background: #1e3a8a;
            color: white;
            padding: 25px;
            border-radius: 12px 12px 0 0;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .search-box {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000012;
        }

        .search-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1e293b;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            color: red;
            margin-top: 15px;
        }

        .result-box {
            display: none;
            background: white;
            margin-top: 20px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000012;
        }

        .result-box h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .student-info {
            line-height: 2;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #cbd5e1;
            text-align: center;
        }

        th {
            background: #dbeafe;
        }

        .summary {
            line-height: 2;
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 23px;
            }

            .search-box, .result-box {
                padding: 18px;
            }

            th, td {
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>ABC College</h1>
        <p>Student Examination Result Portal</p>
    </header>

    <div class="search-box">
        <h2>Check Your Result</h2>

        <form id="resultForm">
            <label for="roll">Roll Number</label>
            <input type="text" id="roll"
                   placeholder="Enter your roll number" required>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>

            <button type="submit">Search Result</button>
        </form>

        <p id="message"></p>
    </div>

    <div class="result-box" id="resultBox">
        <h2>Examination Result</h2>

        <div class="student-info">
            <p><b>Student Name:</b> <span id="name"></span></p>
            <p><b>Roll Number:</b> <span id="studentRoll"></span></p>
            <p><b>Date of Birth:</b> <span id="studentDob"></span></p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody id="marksTable"></tbody>
        </table>

        <div class="summary">
            <p><b>Total Marks:</b> <span id="total"></span></p>
            <p><b>Percentage:</b> <span id="percentage"></span>%</p>
            <p><b>Grade:</b> <span id="grade"></span></p>
            <p><b>Result:</b> <span id="status"></span></p>
        </div>
    </div>

</div>

<script>

// Default student data using JavaScript objects
const students = [
    {
        roll: "101",
        name: "NS",
        dob: "2005-11-04",
        marks: {
            "Python": 85,
            "Java": 78,
            "Database": 90,
            "Web Technology": 88,
            "Mathematics": 80
        }
    },

    {
        roll: "102",
        name: "Prakash",
        dob: "2005-10-02",
        marks: {
            "Python": 90,
            "Java": 85,
            "Database": 92,
            "Web Technology": 95,
            "Mathematics": 89
        }
    },

    {
        roll: "103",
        name: "rahul",
        dob: "2005-08-08",
        marks: {
            "Python": 35,
            "Java": 45,
            "Database": 55,
            "Web Technology": 60,
            "Mathematics": 40
        }
    }
];

// Search result
document.getElementById("resultForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const roll = document.getElementById("roll").value.trim();
    const dob = document.getElementById("dob").value;

    // Find student using roll number and DOB
    const student = students.find(function(s) {
        return s.roll === roll && s.dob === dob;
    });

    const message = document.getElementById("message");
    const resultBox = document.getElementById("resultBox");

    if (!student) {
        message.textContent = "Invalid Roll Number or Date of Birth!";
        resultBox.style.display = "none";
        return;
    }

    message.textContent = "";

    // Display student details
    document.getElementById("name").textContent = student.name;
    document.getElementById("studentRoll").textContent = student.roll;
    document.getElementById("studentDob").textContent = student.dob;

    // Calculate total marks
    const marks = Object.values(student.marks);

    const total = marks.reduce(function(sum, mark) {
        return sum + mark;
    }, 0);

    const maxMarks = marks.length * 100;
    const percentage = (total / maxMarks) * 100;

    // Check pass/fail (minimum 35 in each subject)
    const passed = marks.every(function(mark) {
        return mark >= 35;
    });

    // Calculate grade
    let grade;

    if (!passed) {
        grade = "F";
    } else if (percentage >= 90) {
        grade = "A+";
    } else if (percentage >= 80) {
        grade = "A";
    } else if (percentage >= 70) {
        grade = "B";
    } else if (percentage >= 60) {
        grade = "C";
    } else if (percentage >= 50) {
        grade = "D";
    } else {
        grade = "E";
    }

    // Display subject marks
    const table = document.getElementById("marksTable");
    table.innerHTML = "";

    for (let subject in student.marks) {
        const row = document.createElement("tr");

        const subjectCell = document.createElement("td");
        subjectCell.textContent = subject;

        const marksCell = document.createElement("td");
        marksCell.textContent = student.marks[subject];

        row.appendChild(subjectCell);
        row.appendChild(marksCell);

        table.appendChild(row);
    }

    // Display final result
    document.getElementById("total").textContent =
        total + " / " + maxMarks;

    document.getElementById("percentage").textContent =
        percentage.toFixed(2);

    document.getElementById("grade").textContent = grade;

    const status = document.getElementById("status");
    status.textContent = passed ? "PASS" : "FAIL";
    status.className = passed ? "pass" : "fail";

    resultBox.style.display = "block";

});

</script>

</body>
</html>
